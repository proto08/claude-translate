[project]
name = "claude-translate"
version = "0.1.0"
description = "Local server that translates web page text to Japanese via `claude -p`"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-translate = "claude_translate.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"claude_translate/claude.py" = ["E501"]  # system prompt lines are intentionally long
