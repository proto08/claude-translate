[project]
name = "claude-translate"
version = "0.1.0"
description = "Local server that translates web page text to Japanese via `claude -p`"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-translate = "claude_translate.cli:main"

[build-system]
