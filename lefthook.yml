# Runs before every commit. Check-only (no auto-fix); run `bun run fmt` / `gofmt -w server` to fix.
pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,js}"
      run: bunx oxlint {staged_files}
    oxfmt:
      glob: "{extension/src/**/*.ts,scripts/*.ts,extension/popup.css}"
      run: bunx oxfmt --check {staged_files}
    typecheck:
      glob: "*.ts"
      run: bun run typecheck
    gofmt:
      glob: "server/**/*.go"
      run: test -z "$(gofmt -l server)"
    govet:
      glob: "server/**/*.go"
      root: server/
      run: go vet ./...
    actions-lock:
      glob: ".github/workflows/*.{yml,yaml}"
      run: gh actions-lock --verify-local
