# Minor/patch updates are grouped and auto-merged by ci.yml once CI passes.
# Major updates are NOT grouped: each opens its own PR and is left for manual review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    # Match the 3-day minimum release age in bunfig.toml.
    cooldown:
      default-days: 3
